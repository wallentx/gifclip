<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>gifclip</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app">
      <header class="toolbar" aria-label="Editor controls">
        <label class="iconButton fileButton" for="uploadInput" title="Upload GIF" aria-label="Upload GIF">⇧</label>
        <input id="uploadInput" type="file" accept="image/gif,.gif">

        <div class="toolbarActions">
          <button id="configBtn" class="iconButton" type="button" title="Blueprint tools" aria-label="Blueprint tools" disabled>⚙</button>
          <button id="exportBtn" class="iconButton" type="button" title="Export GIF" aria-label="Export GIF" disabled>⇩</button>
        </div>
      </header>

      <section class="workspace">
        <section class="editorPanel" aria-label="GIF editor">
          <div id="previewStage" class="previewStage is-empty">
            <img id="preview" alt="Current GIF frame preview">
          </div>

          <section class="transportRow" aria-label="Playback and edit controls">
            <button id="playBtn" class="transportButton" type="button" title="Play through remaining slices" aria-label="Play through remaining slices" disabled>▶</button>
            <button id="loopPlayBtn" class="transportButton" type="button" title="Loop selected slice" aria-label="Loop selected slice" disabled>↻</button>
            <button id="prevSliceBtn" class="transportButton" type="button" title="Previous slice" aria-label="Previous slice" disabled>⏮</button>
            <button id="splitBtn" class="transportButton" type="button" title="Split at current frame" aria-label="Split at current frame" disabled>⟂</button>
            <button id="nextSliceBtn" class="transportButton" type="button" title="Next slice" aria-label="Next slice" disabled>⏭</button>
            <button id="prevFrameBtn" class="transportButton" type="button" title="Previous frame" aria-label="Previous frame" disabled>‹</button>
            <button id="nextFrameBtn" class="transportButton" type="button" title="Next frame" aria-label="Next frame" disabled>›</button>
          </section>

          <section class="timelineBlock" aria-label="Timeline">
            <label for="frameSlider">Frame <span id="frameLabel">0</span></label>
            <div class="timelineSlider">
              <div id="previewRenderBar" class="previewRenderBar" aria-hidden="true"></div>
              <span id="frameMarker" class="frameMarker" aria-hidden="true">⟊</span>
              <input id="frameSlider" type="range" min="0" max="0" value="0" disabled>
            </div>
          </section>

          <section class="toolSections" aria-label="Frame and duplicate tools">
            <section class="toolCard" aria-label="Frame delay">
              <div class="toolTitle">Frame <span id="toolFrameLabel">0</span></div>
              <div class="toolRow">
                <label id="delayLabel" for="delayInput">Delay for frame 0</label>
                <input id="delayInput" type="number" min="10" max="600000" step="10" value="10" disabled>
                <span class="unit">ms</span>
              </div>
            </section>

            <details class="toolCard duplicateDetails" aria-label="Duplicate detection">
              <summary class="toolTitle">Duplicates</summary>
              <div class="toolRow duplicateRow">
                <label for="dupeFuzzInput">Fuzz</label>
                <input id="dupeFuzzInput" type="number" min="0" max="255" step="0.25" value="0" disabled>
                <button id="dupeBtn" type="button" disabled>Detect and delete duplicates</button>
              </div>
            </details>
          </section>

          <section class="slicesPanel" aria-label="Slices">
            <div class="panelTitle">Slices</div>
            <div id="sliceList" class="sliceList"></div>
          </section>
        </section>
      </section>
    </main>

    <dialog id="configDialog" class="popupDialog">
      <form method="dialog" class="dialogShell">
        <header class="dialogHeader">
          <h2>Blueprint</h2>
          <button class="iconButton" value="close" aria-label="Close">×</button>
        </header>
        <div class="iconGrid">
          <button id="downloadBlueprintBtn" type="button" title="Download blueprint" aria-label="Download blueprint" disabled>💾</button>
          <button id="copyBlueprintBtn" type="button" title="Copy blueprint text" aria-label="Copy blueprint text" disabled>⧉</button>
          <button id="pasteBlueprintBtn" type="button" title="Paste blueprint text" aria-label="Paste blueprint text" disabled>⎘</button>
          <label class="fileButton iconButton" for="blueprintInput" title="Upload blueprint file" aria-label="Upload blueprint file">⇧</label>
          <input id="blueprintInput" type="file" accept="application/json,.json">
        </div>
      </form>
    </dialog>

    <dialog id="pasteBlueprintDialog" class="popupDialog wideDialog">
      <form method="dialog" class="dialogShell">
        <header class="dialogHeader">
          <h2>Paste Blueprint</h2>
          <button class="iconButton" value="close" aria-label="Close">×</button>
        </header>
        <textarea id="blueprintText" rows="12" spellcheck="false"></textarea>
        <div class="dialogActions">
          <button id="loadBlueprintTextBtn" type="button">Load</button>
        </div>
      </form>
    </dialog>

    <dialog id="exportDialog" class="popupDialog">
      <form method="dialog" class="dialogShell">
        <header class="dialogHeader">
          <h2>Export</h2>
          <button class="iconButton" value="close" aria-label="Close">×</button>
        </header>
        <div class="exportOptionGrid">
          <label for="exportMode">Method</label>
          <select id="exportMode">
            <option value="native">Native edit</option>
            <option value="optimized">Optimize</option>
          </select>

          <label for="exportFps">Target FPS</label>
          <input id="exportFps" type="number" min="1" max="60" step="1" value="9" disabled>

          <label for="exportColors">Colors</label>
          <input id="exportColors" type="number" min="2" max="256" step="1" value="32" disabled>

          <label for="exportScaleWidth">Width</label>
          <input id="exportScaleWidth" type="number" min="16" step="2" placeholder="Original" disabled>

          <label for="exportOptimizeLevel">Gifsicle</label>
          <select id="exportOptimizeLevel" disabled>
            <option value="2">O2</option>
            <option value="3" selected>O3</option>
          </select>
        </div>
        <div id="exportProgress" class="exportProgress" hidden>
          <progress id="exportBar" value="0" max="100"></progress>
          <span id="exportPhase">Idle</span>
        </div>
        <div class="dialogActions">
          <a id="outputLink" hidden>Open export</a>
          <button id="startExportBtn" type="button" disabled>Export</button>
        </div>
      </form>
    </dialog>

    <dialog id="speedDialog" class="popupDialog">
      <form method="dialog" class="dialogShell">
        <header class="dialogHeader">
          <h2 id="speedDialogTitle">Slice Speed</h2>
          <button class="iconButton" value="close" aria-label="Close">×</button>
        </header>
        <div class="speedRow">
          <input id="speedSlider" type="range" min="0.1" max="16" step="0.1" value="1" disabled>
          <input id="speedInput" type="number" min="0.1" max="16" step="0.1" value="1" disabled>
        </div>
        <div class="presetRow" aria-label="Speed presets">
          <button type="button" data-speed="0.5">0.5x</button>
          <button type="button" data-speed="1">1x</button>
          <button type="button" data-speed="2">2x</button>
          <button type="button" data-speed="4">4x</button>
        </div>
      </form>
    </dialog>

    <div id="status" class="srOnly" role="status"></div>
    <script src="/frame-preview.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
