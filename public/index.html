<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>gifclip</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app">
      <header class="toolbar" aria-label="Editor controls">
        <div class="sourceGroup">
          <label for="sourceSelect">Source</label>
          <select id="sourceSelect"></select>
        </div>
        <button id="loadBtn" type="button">Load</button>
        <button id="exportBtn" type="button" disabled>Export</button>
        <a id="outputLink" hidden>Open export</a>
        <div id="exportProgress" class="exportProgress" hidden>
          <progress id="exportBar" value="0" max="100"></progress>
          <span id="exportPhase">Idle</span>
        </div>
      </header>

      <section class="workspace">
        <section class="previewPanel" aria-label="Frame preview">
          <div class="previewStage">
            <img id="preview" alt="Current GIF frame preview">
          </div>
          <div id="status" role="status">Choose a GIF to start.</div>
        </section>

        <aside class="sidePanel" aria-label="Timeline and slices">
          <section class="controlBlock">
            <label for="frameSlider">Frame <span id="frameLabel">0</span></label>
            <div class="frameControlRow">
              <button id="playBtn" type="button" disabled>Play</button>
              <button id="prevFrameBtn" type="button" disabled>Prev</button>
              <input id="frameSlider" type="range" min="0" max="0" value="0" disabled>
              <button id="nextFrameBtn" type="button" disabled>Next</button>
            </div>
            <div id="delayLabel" class="muted">Delay: 0 cs</div>
          </section>

          <section class="actions" aria-label="Slice actions">
            <button id="splitBtn" type="button" disabled>Split here</button>
            <button id="dupeBtn" type="button" disabled>Find duplicates</button>
          </section>

          <section class="controlBlock">
            <label for="speedInput">Slice speed</label>
            <input id="speedInput" type="number" min="0.1" max="16" step="0.1" value="1" disabled>
          </section>

          <section>
            <div class="panelTitle">Slices</div>
            <div id="sliceList" class="sliceList"></div>
          </section>
        </aside>
      </section>
    </main>
    <script src="/frame-preview.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
