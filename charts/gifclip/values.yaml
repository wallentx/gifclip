replicaCount: 1

image:
  repository: gifclip
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8787

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: gifclip.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: false
  size: 10Gi
  storageClassName: ""

env:
  GIFCLIP_FFMPEG_THREADS: ""
  GIFCLIP_DUPLICATE_THREADS: ""
  GIFCLIP_PREVIEW_JOBS: ""
  GIFCLIP_FFMPEG_HWACCEL: auto

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
